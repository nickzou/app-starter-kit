name: Deploy

on:
  # Run the checks on every branch push (fast feedback before a PR exists)…
  push:
    branches: ["**"]
  # …and on PRs into main.
  pull_request:
    branches: [main]

# Don't let two deploys race; a newer push supersedes an in-flight one.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Gate: bad code never reaches the build/deploy jobs.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm turbo typecheck # api + web + mobile
      - name: Biome check
        run: pnpm exec biome check .

  # End-to-end auth flow (web → API → Postgres) in a real browser.
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: app_starter_kit
          POSTGRES_PASSWORD: app_starter_kit
          POSTGRES_DB: app_starter_kit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app_starter_kit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      # The E2E stack reads these from the environment (there's no .env in CI).
      # Ports / origins are set per-server in playwright.config.ts.
      DATABASE_URL: postgresql://app_starter_kit:app_starter_kit@localhost:5432/app_starter_kit
      BETTER_AUTH_SECRET: ci-e2e-secret-not-used-in-prod
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browser
        run: pnpm --filter @app-starter-kit/e2e exec playwright install --with-deps chromium
      - name: Run E2E tests
        run: pnpm --filter @app-starter-kit/e2e test
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

  # Production deployment is disabled until environments are configured.
  deploy:
    needs: [check, e2e]
    # DISABLED: Deploy to production requires DEPLOY_SSH_KEY, DEPLOY_HOST (vars) and
    # ORIGIN_CERT, ORIGIN_KEY (secrets). To re-enable, change condition below to:
    #   github.event_name == 'push' && github.ref == 'refs/heads/main'
    if: github.event_name == 'workflow_dispatch' && vars.PROD_DEPLOYMENT_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to GHCR with the built-in GITHUB_TOKEN
    env:
      IMAGE: ghcr.io/${{ github.repository }}/web
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

      - name: Deploy over SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          ORIGIN_CERT: ${{ secrets.ORIGIN_CERT }}
          ORIGIN_KEY: ${{ secrets.ORIGIN_KEY }}
          IMAGE_REF: ${{ env.IMAGE }}:${{ github.sha }}
        run: |
          set -e

          # SSH key + pin the host key
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          SSH="ssh -i $HOME/.ssh/deploy_key deploy@$DEPLOY_HOST"
          SCP="scp -i $HOME/.ssh/deploy_key"

          # Cloudflare origin cert/key from secrets (local to the runner, gitignored)
          printf '%s\n' "$ORIGIN_CERT" > origin.pem
          printf '%s\n' "$ORIGIN_KEY"  > origin-key.pem

          # Ship the compose stack + Traefik config + certs to the box
          $SSH "mkdir -p app-starter-kit/traefik/dynamic app-starter-kit/certs"
          $SCP deploy/docker-compose.yml      "deploy@$DEPLOY_HOST:app-starter-kit/docker-compose.yml"
          $SCP deploy/traefik/traefik.yml     "deploy@$DEPLOY_HOST:app-starter-kit/traefik/traefik.yml"
          $SCP deploy/traefik/dynamic/tls.yml "deploy@$DEPLOY_HOST:app-starter-kit/traefik/dynamic/tls.yml"
          $SCP origin.pem origin-key.pem      "deploy@$DEPLOY_HOST:app-starter-kit/certs/"
          $SSH "chmod 600 app-starter-kit/certs/origin-key.pem"

          # Deploy: login to GHCR, retire the old single container, bring up the stack
          $SSH "cd app-starter-kit \
            && echo '$REGISTRY_TOKEN' | docker login ghcr.io -u '$ACTOR' --password-stdin \
            && (docker rm -f app-starter-kit-web 2>/dev/null || true) \
            && IMAGE='$IMAGE_REF' docker compose pull \
            && IMAGE='$IMAGE_REF' docker compose up -d --remove-orphans \
            && docker image prune -f"
